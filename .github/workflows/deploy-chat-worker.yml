name: Deploy ZCG Chat Worker

on:
  push:
    branches: ["main"]
    paths:
      - "workers/zcg-chat/**"
      - ".github/workflows/deploy-chat-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require chat secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; missing=1; }
          [ -n "$GROQ_API_KEY" ] || { echo "Missing GitHub secret: GROQ_API_KEY"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Add the secrets above, then re-run this workflow to enable the full ZCG LLM chat (no visitor signup)."
            exit 0
          fi
          echo "CHAT_SECRETS_READY=1" >> "$GITHUB_ENV"

      - name: Deploy Worker
        if: env.CHAT_SECRETS_READY == '1'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/zcg-chat
          command: deploy
          secrets: |
            GROQ_API_KEY
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
